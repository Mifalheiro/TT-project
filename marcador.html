<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* O marcador ocupa a largura toda da página: no PRISM ajusta o tamanho do widget. */
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  body { font-family: 'Arial Narrow', 'Roboto Condensed', Arial, sans-serif; }
  .fundo-teste { background: #3a7d3a; }

  #bug {
    --h: 7.4vw;                       /* altura de cada linha */
    width: 100vw;
    display: grid;
    grid-template-columns: var(--h) var(--h) auto calc(var(--h) * 1.05) 1fr var(--h) calc(var(--h) * 1.15);
    grid-template-rows: var(--h) var(--h);
    background: linear-gradient(180deg, #0f2366 0%, #0a1748 50%, #0c1c58 100%);
    transition: opacity .4s, transform .4s;
  }
  #bug.escondido { opacity: 0; transform: translateY(20%); }

  .logo { display: flex; align-items: center; justify-content: center; background: #fff; border-bottom: 1px solid #0a1748; }
  .logo img { max-width: 88%; max-height: 88%; }
  .logo.vazio { background: transparent; }

  .num {
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: calc(var(--h) * .78); line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .jogos, .sets {
    background: linear-gradient(180deg, #ffd84a 0%, #f2b705 100%);
    color: #0a1748; border-bottom: 1px solid #0a1748;
  }
  .pontos { color: #fff; background: rgba(0,0,0,.25); }

  .nome {
    display: flex; align-items: center;
    padding: 0 calc(var(--h) * .25);
    color: #fff; font-size: calc(var(--h) * .66); white-space: nowrap;
    text-shadow: 0 1px 2px rgba(0,0,0,.5);
  }
  .chev { grid-row: 1 / span 2; grid-column: 4; }
  .chev svg { width: 100%; height: 100%; display: block; }
  .meio { grid-row: 1 / span 2; grid-column: 5; }

  .flash { animation: flash .6s ease-out; }
  @keyframes flash { 0% { filter: brightness(1.8); transform: scale(1.18); } 100% { filter: none; transform: none; } }
</style>
</head>

    <div class="nome" id="na"></div>
    <div class="chev">
      <svg viewBox="0 0 40 100" preserveAspectRatio="none">
        <defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#ffe27a"/><stop offset="1" stop-color="#d99a00"/></linearGradient></defs>
        <polygon points="0,0 14,0 40,50 14,100 0,100 26,50" fill="url(#g)"/>
      </svg>
    </div>
    <div class="meio"></div>
    <div class="num sets" id="sa" style="grid-column:6;grid-row:1">0</div>
    <div class="num pontos" id="pa" style="grid-column:7;grid-row:1">0</div>

    <div class="logo" id="lb" style="grid-column:1;grid-row:2"></div>

    <div class="nome" id="nb" style="grid-column:3;grid-row:2"></div>

    <div class="num pontos" id="pb" style="grid-column:7;grid-row:2">0</div>

  function porNumero(id, valor) {
    var el = document.getElementById(id);
    if (el.textContent !== String(valor)) {
      el.textContent = valor;

  function porLogo(id, eq) {
    var el = document.getElementById(id);
    var src = eq.logo === 'navais' ? LOGO_NAVAIS : (eq.logo === 'slot' ? logos[eq.slot] : '');
    if (src) { el.className = 'logo'; el.innerHTML = '<img src="' + src + '">'; }

  }

  function desenhar(s) {

  function pedir(formato) {
    return fetch(URL_APP + '?formato=' + formato + '&t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.json(); });
  }

  function atualizar() {
    if (ocupado) return;
    if (URL_APP.indexOf('/exec') < 0) {
      document.body.innerHTML = '<div style="background:#fff;color:#a00;font:20px Arial;padding:10px">Falta o link /exec no marcador.html (URL_APP)</div>';
      return;
    }
    ocupado = true;
    pedir('json')
      .then(function (s) {
        ocupado = false;
        if (s.logoV !== versaoLogo) {
          versaoLogo = s.logoV;
          pedir('logos').then(function (l) { logos = l; if (ultimo) desenhar(ultimo); }).catch(function () { versaoLogo = -1; });
        }
        if (s.v !== versao) { versao = s.v; desenhar(s); }
      })
      .catch(function () { ocupado = false; });
  }

  atualizar();
  setInterval(atualizar, 1000);
</script>
</body>
</html>
